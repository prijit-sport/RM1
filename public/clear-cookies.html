<!DOCTYPE html>
<html>
<head>
    <title>Clear Cookies</title>
</head>
<body>
    <h1>กำลังลบ Cookies...</h1>
    <p id="status">กรุณารอสักครู่...</p>
    <script>
        // ลบ cookies ทั้งหมด
        document.cookie.split(";").forEach(function(c) { 
            document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/"); 
        });
        document.cookie = "rm1_session=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/";
        document.cookie = "XSRF-TOKEN=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/";
        
        document.getElementById('status').innerHTML = '<strong style="color:green">✓ ลบ cookies สำเร็จ!</strong><br><br>กรุณาปิด browser แล้วเปิดใหม่ จากนั้น login ใหม่';
    </script>
</body>
</html>
