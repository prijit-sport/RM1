name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    name: รัน PHPUnit (PHP 8.4 + MySQL 8.0)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rm1
          MYSQL_USER: rm1
          MYSQL_PASSWORD: rm1
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # 1) ดึงโค้ดจาก repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2) ตั้งค่า PHP 8.4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql

      # 3) ติดตั้ง dependencies ด้วย composer
      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      # 4) สร้างไฟล์ .env จาก .env.example
      - name: Prepare environment (.env)
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      # 5) ใส่ค่าการเชื่อมต่อ MySQL ลงใน .env
      - name: Configure MySQL in .env
        run: |
          sed -i "s/^DB_HOST=.*/DB_HOST=127.0.0.1/" .env
          sed -i "s/^DB_DATABASE=.*/DB_DATABASE=rm1/" .env
          sed -i "s/^DB_USERNAME=.*/DB_USERNAME=rm1/" .env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=rm1/" .env

      # 6) สร้าง Laravel key
      - name: Generate app key
        run: php artisan key:generate --force

      # 7) รัน migration
      - name: Migrate
        run: php artisan migrate --force

      # 8) รัน test
      - name: PHPUnit
        run: php artisan test

